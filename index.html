         body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .header { background-color: #007c7c; color: white; padding: 20px; text-align: left; }
        .header h1 { margin: 0; font-size: 22px; line-height: 1.4; }
        .header p { margin: 5px 0 0 0; font-size: 14px; }

<body>
		<div class="header">
			<!-- Ensure the filename matches exactly, including spaces -->

    <div class="container">
        <form id="claimForm">
            <!-- Secure Passkey Entry -->
            <div class="form-group">
                <label>Enter your Claim Code (Passkey) *</label>
                <input type="password" id="claimCode" required oninput="authenticateUser()" placeholder="Enter 5-digit code">
            </div>
            
            <div id="claimDetails" class="hidden">
                <div class="form-group">
                    <label>Requestor</label>
                    <input type="text" id="requestor" class="readonly-field" readonly>
                </div>
                
                <div class="form-group">
                    <label>Payee Type *</label>
                    <select id="payeeType" onchange="toggleBusiness()">
                        <option value="Self">Reimburse Myself</option>
                        <option value="Business">Pay a Business/External Entity</option>
                    </select>
                </div>

                <div id="businessSelect" class="form-group hidden">
                    <label>Select Business *</label>
                    <select id="businessList" onchange="fillBusiness()">
                        <option value="">Select...</option>
                        <option value="Coverdale Community Centre">Coverdale Community Centre</option>
                        <option value="Rosewall Community Centre">Rosewall Community Centre</option>
                        <option value="Gods Light Community Inc">Gods Light Community Inc</option>
                        <option value="Wyndham City Council">Wyndham City Council</option>
                        <option value="Wyndham City Council Tarneit">Wyndham City Council Tarneit</option>
                        <option value="Asian Region Association of Community Foundation">Asian Region Association of Community Foundation</option>
                        <option value="WCC">WCC</option>
                        <option value="Rosewall Neigbourhood Centre">Rosewall Neigbourhood Centre</option>
                    </select>
                </div>

                <!-- Auto-filled Fields -->
                <div class="form-group">
                    <label>Payee Name</label>
                    <input type="text" id="payeeName" class="readonly-field" readonly>
                </div>
                <div class="form-group">
                    <label>Group or Business</label>
                    <input type="text" id="group" class="readonly-field" readonly>
                </div>
                <div class="form-group">
                    <label>Payee Email Address</label>
                    <input type="email" id="email" class="readonly-field" readonly>
                </div>
                <div class="form-group">
                    <label>Bank Details</label>
                    <input type="text" id="bank" required placeholder="Format: XXXXXX-XXXXXXXX, BSB and ACCT">
                </div>

                <!-- Expense Items Container -->
                <div id="expenseContainer">
                    <div class="expense-section expense-item">
                        <h3>Expense Item 1</h3>
                        <div class="form-group">
                            <label>Expense Type *</label>
                            <select class="expType" required>
                                <option value="">Select Expense Type...</option>
                                <option value="FFC GENERAL COMMUNITY">FFC GENERAL COMMUNITY</option>
                                <option value="YOUNG PROFESSIONALS OUTREACH">YOUNG PROFESSIONALS OUTREACH</option>
                                <option value="HIGH SCHOOL PROGRAM">HIGH SCHOOL PROGRAM</option>
                                <option value="KIDS MINISTRY">KIDS MINISTRY</option>
                                <option value="OTHER">OTHER</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Expense Subcategory *</label>
                            <select class="expCategory" required>
                                <option value="">Select Subcategory...</option>
                                <option value="Airfare">Airfare</option>
                                <option value="Child minding">Child minding</option>
                                <option value="Decorations">Decorations</option>
                                <option value="External Coordinator Stipend">External Coordinator Stipend</option>
                                <option value="External Coordinator Hosting">External Coordinator Hosting</option>
                                <option value="Equipment (Music, IT)">Equipment (Music, IT)</option>
                                <option value="Gifts and Donations">Gifts and Donations</option>
                                <option value="Giveaways">Giveaways</option>
                                <option value="Hall Hire">Hall Hire</option>
                                <option value="Insurance">Insurance</option>
                                <option value="Kitchen and Foods Supplies">Kitchen and Foods Supplies</option>
                                <option value="Meals, Dine Out (Official Business Meeting)">Meals, Dine Out (Official Business Meeting)</option>
                                <option value="Office and Stationeries Supplies">Office and Stationeries Supplies</option>
                                <option value="Registration Fee">Registration Fee</option>
                                <option value="Stipend Resource Person">Stipend Resource Person</option>
                                <option value="Subscription fee">Subscription fee</option>
                                <option value="Tithe Sword of the Spirit">Tithe Sword of the Spirit</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date of Expense *</label>
                            <input type="date" class="expDate" required>
                        </div>
                        <div class="form-group">
                            <label>Amount ($) *</label>
                            <input type="number" step="0.01" class="expAmount" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Upload Receipts *</label>
                            <input type="file" class="expFiles" multiple required>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-secondary" onclick="addExpenseItem()">+ Add Another Expense Item</button>
                <button type="submit" class="btn" id="submitBtn">Submit Claim</button>
            </div>
        </form>
    </div>

    <script>

            "26330": { name: "Maria Theresa May Jornales", group: "ARIS & KAREN PANGILINAN", email: "mtmjornales@icloud.com", bank: "" },
            "26331": { name: "JayAr Villanueva", group: "ARIS & KAREN PANGILINAN", email: "jaymervill2004@gmail.com", bank: "" },

        };

        const businessDirectory = {
            "Coverdale Community Centre": { group: "Business", email: "leobaleno88_lara@yahoo.com.au", bank: "633-000-103912945" },
            "Rosewall Community Centre": { group: "Business", email: "leobaleno88_lara@yahoo.com.au", bank: "633000-167932631" },
            "Gods Light Community Inc": { group: "Business", email: "glcommunity.syd@gmail.com", bank: "062293-10351899" },
            "Wyndham City Council": { group: "Business", email: "yurevc@yahoo.com", bank: "BPAY Biller Code : 429597 Reference : 100133347" },
            "Wyndham City Council Tarneit": { group: "Business", email: "yurevc@yahoo.com", bank: "BPAY Biller Code : 429597 Reference : 100129311" },
            "Asian Region Association of Community Foundation": { group: "Business", email: "tedquinal@gmail.com", bank: "Acct No: 9961000022" },
            "WCC": { group: "Business", email: "tedquinal@gmail.com", bank: "BPAY Biller Code: 429597 Ref Number: 100137959" },
            "Rosewall Neigbourhood Centre": { group: "Business", email: "leobaleno88_lara@yahoo.com.au", bank: "633-000-167932631" }
        };

        let currentUser = null;

        function authenticateUser() {
            const code = document.getElementById('claimCode').value;
            if (userDirectory[code]) {
                currentUser = userDirectory[code];
                document.getElementById('claimDetails').classList.remove('hidden');
                document.getElementById('requestor').value = `${code}-${currentUser.name}`;
                document.getElementById('payeeType').value = "Self"; 
                toggleBusiness(); 
            } else {
                document.getElementById('claimDetails').classList.add('hidden');
            }
        }

        function toggleBusiness() {
            const type = document.getElementById('payeeType').value;
            if (type === 'Business') {
                document.getElementById('businessSelect').classList.remove('hidden');
                document.getElementById('businessList').required = true;
                // Clear fields waiting for Business selection
                document.getElementById('payeeName').value = "";
                document.getElementById('group').value = "";
                document.getElementById('email').value = "";
                document.getElementById('bank').value = "";
                document.getElementById('bank').readOnly = false;
                document.getElementById('bank').classList.remove('readonly-field');
            } else {
                document.getElementById('businessSelect').classList.add('hidden');
                document.getElementById('businessList').required = false;
                fillSelf();
            }
        }

        function fillSelf() {
            document.getElementById('payeeName').value = currentUser.name;
            document.getElementById('group').value = currentUser.group;
            document.getElementById('email').value = currentUser.email;
            
            const bankInput = document.getElementById('bank');
            bankInput.value = currentUser.bank;
            if (currentUser.bank !== "") {
                bankInput.readOnly = true;
                bankInput.classList.add('readonly-field');
            } else {
                bankInput.readOnly = false;
                bankInput.classList.remove('readonly-field');
            }
        }

        function fillBusiness() {
            const biz = document.getElementById('businessList').value;
            if (businessDirectory[biz]) {
                document.getElementById('payeeName').value = biz;
                document.getElementById('group').value = businessDirectory[biz].group;
                document.getElementById('email').value = businessDirectory[biz].email;
                
                const bankInput = document.getElementById('bank');
                bankInput.value = businessDirectory[biz].bank;
                bankInput.readOnly = true;
                bankInput.classList.add('readonly-field');
            }
        }

        let expenseCount = 1;

        function addExpenseItem() {
            expenseCount++;
            const container = document.getElementById('expenseContainer');
            const html = `
                <div class="expense-section expense-item">
                    <h3>Expense Item ${expenseCount}</h3>
                    <div class="form-group">
                        <label>Expense Type *</label>
                        <select class="expType" required>
                            <option value="">Select Expense Type...</option>
                            <option value="FFC GENERAL COMMUNITY">FFC GENERAL COMMUNITY</option>
                            <option value="YOUNG PROFESSIONALS OUTREACH">YOUNG PROFESSIONALS OUTREACH</option>
                            <option value="HIGH SCHOOL PROGRAM">HIGH SCHOOL PROGRAM</option>
                            <option value="KIDS MINISTRY">KIDS MINISTRY</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Expense Subcategory *</label>
                        <select class="expCategory" required>
                            <option value="">Select Subcategory...</option>
                            <option value="Airfare">Airfare</option>
                            <option value="Child minding">Child minding</option>
                            <option value="Decorations">Decorations</option>
                            <option value="External Coordinator Stipend">External Coordinator Stipend</option>
                            <option value="External Coordinator Hosting">External Coordinator Hosting</option>
                            <option value="Equipment (Music, IT)">Equipment (Music, IT)</option>
                            <option value="Gifts and Donations">Gifts and Donations</option>
                            <option value="Giveaways">Giveaways</option>
                            <option value="Hall Hire">Hall Hire</option>
                            <option value="Insurance">Insurance</option>
                            <option value="Kitchen and Foods Supplies">Kitchen and Foods Supplies</option>
                            <option value="Meals, Dine Out (Official Business Meeting)">Meals, Dine Out (Official Business Meeting)</option>
                            <option value="Office and Stationeries Supplies">Office and Stationeries Supplies</option>
                            <option value="Registration Fee">Registration Fee</option>
                            <option value="Stipend Resource Person">Stipend Resource Person</option>
                            <option value="Subscription fee">Subscription fee</option>
                            <option value="Tithe Sword of the Spirit">Tithe Sword of the Spirit</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date of Expense *</label>
                        <input type="date" class="expDate" required>
                    </div>
                    <div class="form-group">
                        <label>Amount ($) *</label>
                        <input type="number" step="0.01" class="expAmount" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>Upload Receipts *</label>
                        <input type="file" class="expFiles" multiple required>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({
                name: file.name,
                contentBytes: reader.result.split(',')[1] 
            });
            reader.onerror = error => reject(error);
        });

        document.getElementById('claimForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "Sending Data...";
            submitBtn.disabled = true;

            try {
                const dateSubmitted = new Date().toLocaleString(); 
                const expenseElements = document.querySelectorAll('.expense-item');
                let expenseLinesArray = [];

                for (let el of expenseElements) {
                    const fileInput = el.querySelector('.expFiles');
                    let attachments = [];
                    
                    for (let file of fileInput.files) {
                        const fileData = await toBase64(file);
                        attachments.push(fileData);
                    }

                    expenseLinesArray.push({
                        expType: el.querySelector('.expType').value,
                        expCategory: el.querySelector('.expCategory').value,
                        date: el.querySelector('.expDate').value,
                        amount: parseFloat(el.querySelector('.expAmount').value),
                        files: attachments
                    });
                }

                const payload = {
                    requestor: document.getElementById('requestor').value,
                    dateSubmitted: dateSubmitted,
                    payeeName: document.getElementById('payeeName').value,
                    mwgGroup: document.getElementById('group').value,
                    email: document.getElementById('email').value,
                    eftDetails: document.getElementById('bank').value,
                    expenseLines: expenseLinesArray
                };

                const response = await fetch("https://defaulta2ab34e6b7c748fb9bc4208a0f824c.4d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/04/workflows/6541fc1b77154550845797e8199c5a01/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=1hIOCbfUfiMPhigh-OeLhYYMBBRAPFWmjftOefBcSDE", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Claim Submitted Successfully! Power Automate received it.");
                    document.getElementById('claimForm').reset();
                    document.getElementById('claimDetails').classList.add('hidden');
                    document.getElementById('businessSelect').classList.add('hidden');
                } else {
                    alert("Power Automate rejected the data. HTTP Error: " + response.status);
                }

            } catch (error) {
                alert("Submission failed. The browser could not reach Power Automate. Error: " + error.message);
                console.error(error);
            } finally {
                submitBtn.textContent = "Submit Claim";
                submitBtn.disabled = false;
            }
        });
    </script>
