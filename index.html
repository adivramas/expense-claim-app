    function authenticateUser() {

    let expenseCount = 1;
    function addExpense() {
        expenseCount++;
        const container = document.getElementById('expenseContainer');
        const newExpense = document.querySelector('.expense-item').cloneNode(true);
        newExpense.querySelector('b').textContent = `Expense Item ${expenseCount}`;
        newExpense.querySelectorAll('input').forEach(input => input.value = '');
        container.appendChild(newExpense);
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({ name: file.name, contentBytes: reader.result.split(',')[1] });
        reader.onerror = error => reject(error);
    });

    document.getElementById('claimForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.querySelector('button[type="submit"]');
        submitBtn.disabled = true; submitBtn.textContent = "Sending...";

        try {
            let expenseLinesArray = [];
            for (let el of document.querySelectorAll('.expense-item')) {
                let attachments = [];
                for (let file of el.querySelector('.expFiles').files) {
                    attachments.push(await toBase64(file));
                }
                expenseLinesArray.push({
                    expType: el.querySelector('.expType').value,
                    expCategory: el.querySelector('.expCategory').value,
                    date: el.querySelector('.expDate').value,
                    amount: parseFloat(el.querySelector('.expAmount').value),
                    files: attachments
                });
            }

            const payload = {
                requestor: document.getElementById('requestor').value, // This is now purely the 5-digit passkey
                dateSubmitted: new Date().toLocaleString(),
                payeeName: document.getElementById('payeeName').value,
                mwgGroup: document.getElementById('group').value,

            });

                alert("Claim Submitted Successfully!");

            }
        } catch (error) {
            alert("Submission failed. Error: " + error.message);
        } finally {
            submitBtn.textContent = "Submit Claim"; submitBtn.disabled = false;
