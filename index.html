    <script>

            "Alissandra Dela Paz": { group: "ARIEL & ANGIE MARVIDA", email: "alyssecruz@outlook.com" },
            "Janet Ocampo": { group: "MANNY & JOAN DELA PAZ", email: "ocampogelicano@yahoo0.com" },
            "Rolly Rosales": { group: "ARIS & KAREN PANGILINAN", email: "rollyrosales@ffcmelbourne.org" },
            "Ryan Cangco": { group: "MANNY & JOAN DELA PAZ", email: "rcangco@gmail.com" },
            "Evelyn Cangco": { group: "MANNY & JOAN DELA PAZ", email: "ecangco@gmail.com" },
            "Maria Theresa May Jornales": { group: "ARIS & KAREN PANGILINAN", email: "mtmjornales@icloud.com" },

            "Erwin Yago": { group: "ARIS & KAREN PANGILINAN", email: "erwin_yago@yahoo.com" },
            "Coverdale Community Centre": { group: "Business", email: "leobaleno88_lara@yahoo.com.au", bank: "633-000-103912945" },
            "Rosewall Community Centre": { group: "Business", email: "leobaleno88_lara@yahoo.com.au", bank: "633000-167932631" },

            "Wyndham City Council Tarneit": { group: "Business", email: "yurevc@yahoo.com", bank: "BPAY Biller Code : 429597 Reference : 100129311" },
            "Asian Region Association of Community Foundation": { group: "Business", email: "tedquinal@gmail.com", bank: "Acct No: 9961000022" },

        // Handles Payee selection changes to auto-fill group, email, and bank details
        function handlePayeeChange() {
            const select = document.getElementById('payeeNameSelect');
            const text = document.getElementById('payeeNameText');
            const groupSelect = document.getElementById('mwgGroup');
            const emailInput = document.getElementById('email');
            const bankInput = document.getElementById('eftDetails');

            const payee = select.value;

            // 1. Toggle the "Unenrolled" text box
            if (payee === 'Unenrolled') {
                text.style.display = 'block';
                text.required = true;
            } else {
                text.style.display = 'none';
                text.required = false;
            }

            // 2. Auto-fill the details if the payee is in our master dictionary
            const details = payeeDetails[payee];
            if (details) {
                groupSelect.value = details.group || "";
                emailInput.value = details.email || "";

                if (details.bank) {
                    bankInput.value = details.bank;
                    bankInput.readOnly = true; 
                    bankInput.style.backgroundColor = "#e9ecef"; 
                } else {
                    bankInput.value = ""; 
                    bankInput.readOnly = false; 
                    bankInput.style.backgroundColor = ""; 
                }
            } else {
                // Clear fields for Unenrolled members so they can type their own details
                groupSelect.value = "";
                emailInput.value = "";
                bankInput.value = ""; 
                bankInput.readOnly = false; 
                bankInput.style.backgroundColor = ""; 
            }
        }

        // Toggle text boxes when Event is "Other"
        function toggleInput(selectId, textId, triggerValue) {
            const select = document.getElementById(selectId);
            const text = document.getElementById(textId);
            if (select.value === triggerValue) {
                text.style.display = 'block';
                text.required = true;
            } else {
                text.style.display = 'none';
                text.required = false;
            }
        }

        // Toggle text box for dynamic Expense Rows when "Other" is selected
        function toggleDynamicInput(selectElement) {
            const textElement = selectElement.nextElementSibling;
            if (selectElement.value === 'Other') {
                textElement.style.display = 'block';
                textElement.required = true;
            } else {
                textElement.style.display = 'none';
                textElement.required = false;
            }
        }

        let expenseCount = 1;

        // Function to dynamically add new expense rows
        function addExpenseItem() {
            expenseCount++;
            const container = document.getElementById('expenseContainer');
            const html = `
                <div class="expense-section expense-item">
                    <h3>Expense Item ${expenseCount}</h3>
                    <div class="form-group">
                        <label>Expense Type Category *</label>
                        <select class="expCategory" required onchange="toggleDynamicInput(this)">
                            <option value="">Select...</option>
                            <option value="Airfare">Airfare</option>
                            <option value="Child minding">Child minding</option>
                            <option value="Decorations">Decorations</option>
                            <option value="External Coordinator Stipend">External Coordinator Stipend</option>
                            <option value="External Coordinator Hosting">External Coordinator Hosting</option>
                            <option value="Equipment (Music, IT)">Equipment (Music, IT)</option>
                            <option value="Gifts and Donations">Gifts and Donations</option>
                            <option value="Giveaways">Giveaways</option>
                            <option value="Hall Hire">Hall Hire</option>
                            <option value="Insurance">Insurance</option>
                            <option value="Kitchen and Foods Supplies">Kitchen and Foods Supplies</option>
                            <option value="Meals, Dine Out (Official Business Meeting)">Meals, Dine Out (Official Business Meeting)</option>
                            <option value="Office and Stationeries Supplies">Office and Stationeries Supplies</option>
                            <option value="Registration Fee">Registration Fee</option>
                            <option value="Stipend Resource Person">Stipend Resource Person</option>
                            <option value="Subscription fee">Subscription fee</option>
                            <option value="Tithe Sword of the Spirit">Tithe Sword of the Spirit</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="text" class="expCategoryText hidden-input" placeholder="Specify Category">
                    </div>
                    <div class="form-group">
                        <label>Date of Expense *</label>
                        <input type="date" class="expDate" required>
                    </div>
                    <div class="form-group">
                        <label>Amount ($) *</label>
                        <input type="number" step="0.01" class="expAmount" required>
                    </div>
                    <div class="form-group">
                        <label>Upload Receipts (Attach multiple images/PDFs for this category) *</label>
                        <input type="file" class="expFiles" multiple required>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        // Helper function to convert files to Base64
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({
                name: file.name,
                contentBytes: reader.result.split(',')[1] 
            });
            reader.onerror = error => reject(error);
        });

        // Form submission handler
        document.getElementById('claimForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "Sending Data...";
            submitBtn.disabled = true;

            try {
                // Determine final values for Payee and Events (handles "Other" / "Unenrolled")
                const payeeSelect = document.getElementById('payeeNameSelect').value;
                const finalPayee = (payeeSelect === 'Unenrolled') ? document.getElementById('payeeNameText').value : payeeSelect;

                const eventsSelect = document.getElementById('eventsSelect').value;
                const finalEvents = (eventsSelect === 'Other') ? document.getElementById('eventsText').value : eventsSelect;

                // 1. Gather all individual expense lines and read files
                const expenseElements = document.querySelectorAll('.expense-item');
                let expenseLinesArray = [];

                for (let el of expenseElements) {
                    const fileInput = el.querySelector('.expFiles');
                    let attachments = [];
                    
                    // Convert attached files to base64
                    for (let file of fileInput.files) {
                        const fileData = await toBase64(file);
                        attachments.push(fileData);
                    }

                    // Determine category (handles "Other")
                    const catSelect = el.querySelector('.expCategory').value;
                    const finalCategory = (catSelect === 'Other') ? el.querySelector('.expCategoryText').value : catSelect;

                    expenseLinesArray.push({
                        category: finalCategory,
                        date: el.querySelector('.expDate').value,
                        amount: parseFloat(el.querySelector('.expAmount').value),
                        files: attachments
                    });
                }

                // 2. Build the final JSON payload
                const payload = {
                    payeeName: finalPayee,
                    mwgGroup: document.getElementById('mwgGroup').value,
                    serviceGroup: document.getElementById('serviceGroup').value,
                    events: finalEvents,
                    eftDetails: document.getElementById('eftDetails').value,
                    email: document.getElementById('email').value,
                    expenseLines: expenseLinesArray
                };

                // 3. Send the data to Power Automate (PASTE YOUR ACTUAL TRIGGER URL BELOW)
                const response = await fetch("PASTE_YOUR_POWER_AUTOMATE_HTTP_URL_HERE", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                // 4. Handle the response
                if (response.ok) {
                    alert("Claim Submitted Successfully! Power Automate received it.");
                    document.getElementById('claimForm').reset();
                    // Reset dropdown auto-fill styles and hidden text boxes
                    document.getElementById('eftDetails').readOnly = false;
                    document.getElementById('eftDetails').style.backgroundColor = "";
                    document.querySelectorAll('.hidden-input').forEach(el => el.style.display = 'none');
                } else {
                    alert("Power Automate rejected the data. HTTP Error: " + response.status);
                }

            } catch (error) {
                alert("Submission failed. The browser could not reach Power Automate. Error: " + error.message);
                console.error(error);
            } finally {
                submitBtn.textContent = "Submit Claim";
                submitBtn.disabled = false;
            }
        });
    </script>
