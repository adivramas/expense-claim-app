<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Expense Reimbursement Claim Form</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .header { background-color: #007c7c; color: white; padding: 20px; text-align: left; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .expense-section { border-left: 4px solid #007c7c; padding-left: 15px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; }
        .expense-section h3 { margin-top: 0; font-size: 16px; }
        .btn { padding: 10px 15px; background-color: #007c7c; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn-secondary { background-color: #555; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Community Expense Reimbursement Claim Form</h1>
        <p>Families for Christ Melbourne</p>
    </div>

    <div class="container">
        <form id="claimForm">
            <!-- General Info -->
            <div class="form-group">
                <label>Full Name (Payee Name) *</label>
                <input type="text" id="payeeName" required>
            </div>
            <div class="form-group">
                <label>MWG or Pastoral Grouping *</label>
                <select id="mwgGroup" required>
                    <option value="">Select...</option>
                    <option value="MANNY & JOAN DELA PAZ">MANNY & JOAN DELA PAZ</option>
                    <option value="OTHER">OTHER</option>
                </select>
            </div>
            <div class="form-group">
                <label>SERVICE GROUP & MINISTRY *</label>
                <select id="serviceGroup" required>
                    <option value="">Select...</option>
                    <option value="FFC GENERAL COMMUNITY">FFC GENERAL COMMUNITY</option>
                    <option value="OTHER">OTHER</option>
                </select>
            </div>
            <div class="form-group">
                <label>Events *</label>
                <input type="text" id="events" required>
            </div>
            <div class="form-group">
                <label>Bank Transfer details (EFT) *</label>
                <input type="text" id="eftDetails" required>
            </div>
            <div class="form-group">
                <label>Payee's email address *</label>
                <input type="email" id="email" required>
            </div>

            <!-- Expense Items Container -->
            <div id="expenseContainer">
                <div class="expense-section expense-item">
                    <h3>Expense Item 1</h3>
                    <div class="form-group">
                        <label>Expense Type Category *</label>
                        <select class="expCategory" required>
                            <option value="">Select...</option>
                            <option value="External Coordinator Visit">External Coordinator Visit</option>
                            <option value="Kitchen Supplies">Kitchen Supplies</option>
                            <option value="Hall Hire">Hall Hire</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date of Expense *</label>
                        <input type="date" class="expDate" required>
                    </div>
                    <div class="form-group">
                        <label>Amount ($) *</label>
                        <input type="number" step="0.01" class="expAmount" required>
                    </div>
                    <div class="form-group">
                        <label>Upload Receipts (Attach multiple images/PDFs for this category) *</label>
                        <input type="file" class="expFiles" multiple required>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-secondary" onclick="addExpenseItem()">+ Add Another Expense Category</button>
            <button type="submit" class="btn" id="submitBtn">Submit Claim</button>
        </form>
    </div>

    <script>
        let expenseCount = 1;

        // Function to dynamically add new expense rows
        function addExpenseItem() {
            expenseCount++;
            const container = document.getElementById('expenseContainer');
            const html = `
                <div class="expense-section expense-item">
                    <h3>Expense Item ${expenseCount}</h3>
                    <div class="form-group">
                        <label>Expense Type Category *</label>
                        <select class="expCategory" required>
                            <option value="">Select...</option>
                            <option value="External Coordinator Visit">External Coordinator Visit</option>
                            <option value="Kitchen Supplies">Kitchen Supplies</option>
                            <option value="Hall Hire">Hall Hire</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date of Expense *</label>
                        <input type="date" class="expDate" required>
                    </div>
                    <div class="form-group">
                        <label>Amount ($) *</label>
                        <input type="number" step="0.01" class="expAmount" required>
                    </div>
                    <div class="form-group">
                        <label>Upload Receipts (Attach multiple images/PDFs for this category) *</label>
                        <input type="file" class="expFiles" multiple required>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        // Helper function to convert files to Base64 so they can be sent in JSON
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({
                name: file.name,
                contentBytes: reader.result.split(',')[1] 
            });
            reader.onerror = error => reject(error);
        });

        // Form submission handler
        document.getElementById('claimForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "Sending Data...";
            submitBtn.disabled = true;

            try {
                // 1. Gather all individual expense lines and read files
                const expenseElements = document.querySelectorAll('.expense-item');
                let expenseLinesArray = [];

                for (let el of expenseElements) {
                    const fileInput = el.querySelector('.expFiles');
                    let attachments = [];
                    
                    // Convert attached files to base64
                    for (let file of fileInput.files) {
                        const fileData = await toBase64(file);
                        attachments.push(fileData);
                    }

                    expenseLinesArray.push({
                        category: el.querySelector('.expCategory').value,
                        date: el.querySelector('.expDate').value,
                        amount: parseFloat(el.querySelector('.expAmount').value),
                        files: attachments
                    });
                }

                // 2. Build the final JSON payload
                const payload = {
                    payeeName: document.getElementById('payeeName').value,
                    mwgGroup: document.getElementById('mwgGroup').value,
                    serviceGroup: document.getElementById('serviceGroup').value,
                    events: document.getElementById('events').value,
                    eftDetails: document.getElementById('eftDetails').value,
                    email: document.getElementById('email').value,
                    expenseLines: expenseLinesArray
                };

                // 3. Send the data to Power Automate
                const response = await fetch("https://defaulta2ab34e6b7c748fb9bc4208a0f824c.4d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/04/workflows/6541fc1b77154550845797e8199c5a01/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=1hIOCbfUfiMPhigh-OeLhYYMBBRAPFWmjftOefBcSDE", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                // 4. Handle the response
                if (response.ok) {
                    alert("Claim Submitted Successfully! Power Automate received it.");
                    document.getElementById('claimForm').reset();
                } else {
                    alert("Power Automate rejected the data. HTTP Error: " + response.status);
                }

            } catch (error) {
                alert("Submission failed. The browser could not reach Power Automate. Error: " + error.message);
                console.error(error);
            } finally {
                submitBtn.textContent = "Submit Claim";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
