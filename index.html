<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFC Community Expense Claims</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .header { background: linear-gradient(to right, #2499d1, #406fba); color: white; padding: 20px; display: flex; align-items: center; gap: 15px; }
        .header img { width: 70px; height: auto; background-color: white; border-radius: 50%; padding: 5px; }
        .header-text h1 { margin: 0; font-size: 22px; line-height: 1.4; }
        .header-text p { margin: 5px 0 0 0; font-size: 14px; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .expense-section { border-left: 4px solid #3286c4; padding-left: 15px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; }
        .btn { padding: 10px 15px; background-color: #3286c4; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn:hover { background-color: #2499d1; }
        .btn-secondary { background-color: #555; margin-bottom: 20px; }
        .hidden { display: none !important; }
        .readonly-field { background-color: #e9ecef; color: #555; }
    </style>
</head>
<body>

    <div class="header">
        <img src="Untitled design.png" alt="FFC Logo">
        <div class="header-text">
            <h1>FFC Community EXPENSE Payment and Reimbursement</h1>
            <p>Families for Christ Melbourne</p>
        </div>
    </div>

    <div class="container">
        <!-- Secure Passkey Gateway -->
        <div class="form-group" id="loginSection">
            <label>Enter your 5-Digit Claim Code (Passkey) *</label>
            <input type="password" id="claimCode" placeholder="Enter code to unlock">
            <button type="button" class="btn" onclick="authenticateUser()">Unlock Form</button>
        </div>

        <form id="claimForm" class="hidden">
            <input type="hidden" id="requestor">

            <div class="form-group">
                <label>Claim Path *</label>
                <select id="claimPath" onchange="togglePath()">
                    <option value="Self">1. Claim for Self</option>
                    <option value="Business">2. Claim for Business</option>
                </select>
            </div>

            <!-- Business Selection Directory -->
            <div id="businessSelectGroup" class="form-group hidden">
                <label>Select Business *</label>
                <select id="businessList" onchange="fillBusiness()">
                    <option value="">Select...</option>
                    <option value="Coverdale Community Centre">Coverdale Community Centre</option>
                    <option value="Rosewall Community Centre">Rosewall Community Centre</option>
                    <option value="Gods Light Community Inc">Gods Light Community Inc</option>
                    <option value="New">Enter New / Unenrolled Business</option>
                </select>
            </div>

            <!-- Dynamic Identity Fields -->
            <div class="form-group">
                <label>Payee Name</label>
                <input type="text" id="payeeName" class="readonly-field" readonly required>
            </div>
            <div class="form-group">
                <label>Group or Business</label>
                <input type="text" id="group" class="readonly-field" readonly required>
            </div>
            <div class="form-group">
                <label>Payee Email</label>
                <input type="email" id="email" class="readonly-field" readonly required>
            </div>
            <div class="form-group">
                <label>Bank Details</label>
                <input type="text" id="bankDetails" class="readonly-field" readonly required>
            </div>

            <!-- Expense Items Container -->
            <div id="expenseContainer">
                <div class="expense-section expense-item">
                    <h3>Expense Item 1</h3>
                    <div class="form-group">
                        <label>Expense Type *</label>
                        <select class="expType" required>
                            <option value="">Select...</option>
                            <option value="FFC GENERAL COMMUNITY">FFC GENERAL COMMUNITY</option>
                            <option value="YOUNG PROFESSIONALS OUTREACH">YOUNG PROFESSIONALS OUTREACH</option>
                            <option value="HIGH SCHOOL PROGRAM">HIGH SCHOOL PROGRAM</option>
                            <option value="KIDS MINISTRY">KIDS MINISTRY</option>
                            <option value="OTHER">OTHER</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subcategory *</label>
                        <select class="expCategory" required>
                            <option value="">Select...</option>
                            <option value="Airfare">Airfare</option>
                            <option value="Hall Hire">Hall Hire</option>
                            <option value="Kitchen and Foods Supplies">Kitchen and Foods Supplies</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date *</label><input type="date" class="expDate" required>
                    </div>
                    <div class="form-group">
                        <label>Amount ($) *</label><input type="number" step="0.01" class="expAmount" required>
                    </div>
                    <div class="form-group">
                        <label>Upload Receipts *</label><input type="file" class="expFiles" multiple required>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-secondary" onclick="addExpenseItem()">+ Add Another Expense Item</button>
            <button type="submit" class="btn" id="submitBtn">Submit Claim</button>
        </form>
    </div>

    <script>
        // Directory stripped of private bank details for security
        const userDirectory = {
            "26312": { name: "Karen Pangilinan", group: "ARIS & KAREN PANGILINAN", email: "karenruthpangilinan@yahoo.com" },
            "26313": { name: "Aris Pangilinan", group: "ARIS & KAREN PANGILINAN", email: "arismp93@yahoo.com" },
            "26314": { name: "Janette Ocampo", group: "MANNY & JOAN DELA PAZ", email: "ocampogelicano@yahoo.com" }
            // Add remaining passkeys here
        };

        const businessDirectory = {
            "Coverdale Community Centre": { email: "leobaleno88_lara@yahoo.com.au", bank: "633-000-103912945" },
            "Rosewall Community Centre": { email: "leobaleno88_lara@yahoo.com.au", bank: "633000-167932631" },
            "Gods Light Community Inc": { email: "glcommunity.syd@gmail.com", bank: "062293-10351899" }
        };

        let currentUser = null;

        function authenticateUser() {
            const code = document.getElementById('claimCode').value;
            if (userDirectory[code]) {
                currentUser = userDirectory[code];
                document.getElementById('requestor').value = `${code}-${currentUser.name}`;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('claimForm').classList.remove('hidden');
                togglePath(); 
            } else {
                alert("Invalid Passkey. Please try again.");
            }
        }

        function setFieldsReadonly(isReadonly) {
            ['payeeName', 'group', 'email', 'bankDetails'].forEach(id => {
                document.getElementById(id).readOnly = isReadonly;
                if (isReadonly) {
                    document.getElementById(id).classList.add('readonly-field');
                } else {
                    document.getElementById(id).classList.remove('readonly-field');
                }
            });
        }

        function togglePath() {
            const path = document.getElementById('claimPath').value;
            const bizSelect = document.getElementById('businessSelectGroup');

            // Reset fields
            document.getElementById('payeeName').value = "";
            document.getElementById('group').value = "";
            document.getElementById('email').value = "";
            document.getElementById('bankDetails').value = "";
            document.getElementById('businessList').value = "";

            if (path === "Self") {
                bizSelect.classList.add('hidden');
                setFieldsReadonly(true);
                document.getElementById('payeeName').value = currentUser.name;
                document.getElementById('group').value = currentUser.group;
                document.getElementById('email').value = currentUser.email;
                document.getElementById('bankDetails').value = "🔒 Registered on File (Sent via Email for Confirmation).";
            } else {
                bizSelect.classList.remove('hidden');
                setFieldsReadonly(true); 
            }
        }

        function fillBusiness() {
            const biz = document.getElementById('businessList').value;
            
            if (biz === "New") {
                setFieldsReadonly(false);
                document.getElementById('payeeName').value = "";
                document.getElementById('group').value = "Business";
                document.getElementById('group').readOnly = true; 
                document.getElementById('group').classList.add('readonly-field');
                document.getElementById('email').value = "";
                document.getElementById('bankDetails').value = "";
            } else if (businessDirectory[biz]) {
                setFieldsReadonly(true);
                document.getElementById('payeeName').value = biz;
                document.getElementById('group').value = "Business";
                document.getElementById('email').value = businessDirectory[biz].email;
                document.getElementById('bankDetails').value = businessDirectory[biz].bank;
            } else {
                setFieldsReadonly(true);
                document.getElementById('payeeName').value = "";
                document.getElementById('group').value = "";
                document.getElementById('email').value = "";
                document.getElementById('bankDetails').value = "";
            }
        }

        let expenseCount = 1;
        function addExpenseItem() {
            expenseCount++;
            const html = `
                <div class="expense-section expense-item">
                    <h3>Expense Item ${expenseCount}</h3>
                    <div class="form-group">
                        <label>Expense Type *</label>
                        <select class="expType" required><option value="FFC GENERAL COMMUNITY">FFC GENERAL COMMUNITY</option><option value="OTHER">OTHER</option></select>
                    </div>
                    <div class="form-group">
                        <label>Subcategory *</label>
                        <select class="expCategory" required><option value="Hall Hire">Hall Hire</option><option value="Other">Other</option></select>
                    </div>
                    <div class="form-group"><label>Date *</label><input type="date" class="expDate" required></div>
                    <div class="form-group"><label>Amount ($) *</label><input type="number" step="0.01" class="expAmount" required></div>
                    <div class="form-group"><label>Upload Receipts *</label><input type="file" class="expFiles" multiple required></div>
                </div>`;
            document.getElementById('expenseContainer').insertAdjacentHTML('beforeend', html);
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = () => resolve({ name: file.name, contentBytes: reader.result.split(',')[1] });
            reader.onerror = error => reject(error);
        });

        document.getElementById('claimForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "Sending Data..."; submitBtn.disabled = true;

            try {
                let expenseLinesArray = [];
                for (let el of document.querySelectorAll('.expense-item')) {
                    let attachments = [];
                    for (let file of el.querySelector('.expFiles').files) attachments.push(await toBase64(file));
                    expenseLinesArray.push({
                        expType: el.querySelector('.expType').value,
                        expCategory: el.querySelector('.expCategory').value,
                        date: el.querySelector('.expDate').value,
                        amount: parseFloat(el.querySelector('.expAmount').value),
                        files: attachments
                    });
                }

                // If "Self", send empty string for bank so backend knows to look it up. Otherwise send the visible text.
                const isSelf = document.getElementById('claimPath').value === "Self";
                const bankPayload = isSelf ? "" : document.getElementById('bankDetails').value;

                const payload = {
                    requestor: document.getElementById('requestor').value,
                    dateSubmitted: new Date().toLocaleString(),
                    payeeName: document.getElementById('payeeName').value,
                    mwgGroup: document.getElementById('group').value,
                    email: document.getElementById('email').value,
                    eftDetails: bankPayload,
                    expenseLines: expenseLinesArray
                };

                const response = await fetch("YOUR_POWER_AUTOMATE_URL_HERE", {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Claim Submitted Successfully!");
                    location.reload(); 
                } else {
                    alert("Power Automate rejected the data. HTTP Error: " + response.status);
                }
            } catch (error) {
                alert("Submission failed. Error: " + error.message);
            } finally {
                submitBtn.textContent = "Submit Claim"; submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
